# Non-Bun developer tools, version-pinned (aqua backend: checksum-verified official releases, no
# postinstall). `mise trust` once after cloning, then e.g. `mise exec -- actionlint`.

[tools]
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.26.1"
"aqua:koalaman/shellcheck" = "0.11.0"
