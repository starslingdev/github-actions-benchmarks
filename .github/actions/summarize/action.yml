name: Summarize
description: Tabulate every bench job's phase timings into the run summary and a results artifact.
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: bench-*
        path: ${{ runner.temp }}/bench
    # One bench-<label>-<replica> artifact per job: host.json (host-info) and phases.tsv (bin/mark
    # lines, then bench-finish's `end <µs> <job status>`). A phase runs to the next boundary. The
    # table has one row per runner label, with p50 / p90 over that label's successful replicas.
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const fs = require("node:fs");
          const dir = `${process.env.RUNNER_TEMP}/bench`;
          const read = (job, file) => fs.readFileSync(`${dir}/${job}/${file}`, "utf8");
          const jobs = (fs.existsSync(dir) ? fs.readdirSync(dir) : []).map((job) => {
            const rows = read(job, "phases.tsv").trim().split("\n").map((line) => line.split("\t"));
            const phases = rows.slice(0, -1).flatMap(([name, start], i) => (name === "-" ? [] : [{ name, seconds: (rows[i + 1][1] - start) / 1e6 }]));
            const totalSeconds = phases.reduce((sum, phase) => sum + phase.seconds, 0);
            return { ...JSON.parse(read(job, "host.json")), status: rows.at(-1)[2], phases, totalSeconds };
          });
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/results.json`, JSON.stringify(jobs, null, 2));

          // Linear-interpolation percentile (numpy's default).
          const percentile = (values, p) => {
            const sorted = values.toSorted((a, b) => a - b);
            const i = (sorted.length - 1) * p;
            return sorted[Math.floor(i)] + (sorted[Math.ceil(i)] - sorted[Math.floor(i)]) * (i % 1);
          };
          const stat = (values) => (values.length ? `${percentile(values, 0.5).toFixed(1)} / ${percentile(values, 0.9).toFixed(1)}` : "—");
          const names = [...new Set(jobs.flatMap((job) => job.phases.map((phase) => phase.name)))];
          // One row per label. Smallest tier first; within a tier, fastest p50 total first, then labels
          // with no successful replica.
          const cells = Object.values(Object.groupBy(jobs, (job) => job.label)).map((runs) => {
            const ok = runs.filter((job) => job.status === "success");
            return { ...runs[0], runs, ok, p50: ok.length ? percentile(ok.map((job) => job.totalSeconds), 0.5) : Infinity };
          });
          cells.sort((a, b) => a.advertisedVcpu - b.advertisedVcpu || a.p50 - b.p50);
          await core.summary
            .addHeading(context.workflow)
            .addRaw("p50 / p90 seconds over each runner's successful replicas.", true)
            .addTable([
              ["vCPU", "runner", "RAM GiB", "ok", ...names, "total"].map((data) => ({ data, header: true })),
              ...cells.map((cell) => [
                `${cell.vcpu}`,
                cell.label,
                `${cell.memoryGiB}`,
                `${cell.ok.length}/${cell.runs.length}`,
                ...names.map((name) => stat(cell.ok.flatMap((job) => job.phases.filter((phase) => phase.name === name).map((phase) => phase.seconds)))),
                stat(cell.ok.map((job) => job.totalSeconds)),
              ]),
            ])
            .write();
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: results
        path: ${{ runner.temp }}/results.json
        retention-days: 90
