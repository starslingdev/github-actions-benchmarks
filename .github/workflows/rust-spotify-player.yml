name: Rust build (spotify-player)

# aome510/spotify-player's CI (fmt, test, clippy) on every runner in bench.yml's matrix. The phases
# live in .github/actions/rust-spotify-player; the shared pipeline is .github/workflows/bench.yml.

on:
  workflow_dispatch:
    inputs:
      replicas:
        description: Jobs per runner (1-40)
        type: number
        default: 5

permissions:
  contents: read

concurrency:
  group: rust-spotify-player-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    uses: ./.github/workflows/bench.yml
    with:
      suite: rust-spotify-player
      # workflow_dispatch hands number inputs over as strings; bench.yml takes a number.
      replicas: ${{ fromJSON(inputs.replicas) }}
