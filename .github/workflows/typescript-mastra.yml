name: TypeScript build (mastra)

# mastra-ai/mastra's checkout, cold install, lint and build on every runner in bench.yml's matrix.
# The phases live in .github/actions/typescript-mastra; the shared pipeline is
# .github/workflows/bench.yml.

on:
  workflow_dispatch:
    inputs:
      replicas:
        description: Jobs per runner (1-40)
        type: number
        default: 5

permissions:
  contents: read

concurrency:
  group: typescript-mastra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    uses: ./.github/workflows/bench.yml
    with:
      suite: typescript-mastra
      # workflow_dispatch hands number inputs over as strings; bench.yml takes a number.
      replicas: ${{ fromJSON(inputs.replicas) }}
